name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests y APK debug
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk iptv-player.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest iptv-player.apk --title "IPTV Player (última versión)" --notes "APK compilado y probado automáticamente desde main (commit ${GITHUB_SHA::7})." --latest
